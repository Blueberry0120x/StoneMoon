<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Moons — 3D Passage Universe</title>
<style>

/* ---- Theme variables ---- */
:root {
  --lp-bg-a:#05091a;--lp-bg-b:#020612;--lp-bd:#0c1828;
  --card-bg:#070c1c;--card-bd:#0c1828;
  --t0:#d4c8b8;--t1:#4a4838;--t2:#2a3850;--t3:#1a2438;
  --gold:#d4af37;--gold2:#c4a020;
  --srch-bg:#060b18;--item-hov:rgba(255,255,255,0.04);--item-act:rgba(255,255,255,0.07);
  --sb-thumb:#141e30;--divider:#0c1828;
  --stat-num:#d4af37;--char-desc:#3a3428;--snip:#3a3020;
  --chip-bg:#060b18;--chip-bd:#141e30;--chip-col:#2a4060;
  --bar-track:#08101e;--pname:#4a6080;--pmeta:#1e2a3a;--back-link:#2a3848;
}
body.lm {
  --lp-bg-a:#edeae4;--lp-bg-b:#f7f4ef;--lp-bd:#cdc8c0;
  --card-bg:#faf8f5;--card-bd:#d5cec6;
  --t0:#241808;--t1:#6a5840;--t2:#8a7860;--t3:#a89870;
  --gold:#7a5800;--gold2:#6a4a00;
  --srch-bg:#f7f4ef;--item-hov:rgba(0,0,0,0.04);--item-act:rgba(0,0,0,0.07);
  --sb-thumb:#c0b8b0;--divider:#d0c8c0;
  --stat-num:#7a5800;--char-desc:#6a5840;--snip:#5a4830;
  --chip-bg:#eee9e2;--chip-bd:#c8c0b8;--chip-col:#4a5870;
  --bar-track:#e2ddd6;--pname:#4a6080;--pmeta:#8a7860;--back-link:#5a7090;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Georgia,serif;background:#000814}
body{display:flex}

/* ---- Theme toggle ---- */
#lp-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
#theme-btn{
  background:none;border:1px solid var(--lp-bd);color:var(--t2);
  font-size:14px;line-height:1;padding:3px 9px;border-radius:3px;cursor:pointer;
  transition:border-color .2s,color .2s
}
#theme-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ---- Left panel ---- */
#lp{
  width:40%;min-width:270px;max-width:460px;
  height:100vh;overflow-y:auto;flex-shrink:0;
  background:linear-gradient(180deg,var(--lp-bg-a) 0%,var(--lp-bg-b) 100%);
  border-right:1px solid var(--lp-bd);
  padding:16px 16px 24px;color:var(--t0);
  transition:background .3s,color .3s,border-color .3s;
}
#lp::-webkit-scrollbar{width:4px}
#lp::-webkit-scrollbar-track{background:var(--lp-bg-b)}
#lp::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:2px}

/* LP typography */
.lp-title{font-size:17px;letter-spacing:.1em;color:var(--gold);font-variant:small-caps;margin-bottom:3px}
.lp-subtitle{font-size:10px;color:var(--t2);letter-spacing:.07em;margin-bottom:14px}
.lp-hint{font-size:10px;color:var(--t3);margin-top:16px;text-align:center;letter-spacing:.04em;font-style:italic}
.lp-section-hdr{font-size:9px;letter-spacing:.12em;color:var(--t2);text-transform:uppercase;margin:14px 0 7px}
.lp-divider{border:none;border-top:1px solid var(--divider);margin:14px 0}

/* Stats */
.lp-stat-row{
  font-size:11px;color:var(--t1);margin:5px 0;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.lp-sr-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-stat-val{color:var(--gold2);font-size:12px;flex-shrink:0}
.lp-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.lp-stat-card{
  background:var(--card-bg);border:1px solid var(--card-bd);
  border-radius:3px;padding:9px;text-align:center;
  transition:background .3s,border-color .3s
}
.lp-stat-num{color:var(--stat-num);font-size:15px;margin-bottom:2px}
.lp-stat-lbl{color:var(--t3);font-size:8px;letter-spacing:.07em;text-transform:uppercase}

/* Character cards */
.lp-char-card{
  border-left:2px solid;padding:9px 11px;margin:7px 0;
  background:var(--card-bg);border-radius:0 3px 3px 0;
  transition:background .3s
}
.lp-char-name{font-size:11px;letter-spacing:.08em;font-variant:small-caps;margin-bottom:4px}
.lp-char-desc{font-size:10px;color:var(--char-desc);line-height:1.65}

/* Bars */
.lp-bars{margin:4px 0}
.lp-bar-row{display:flex;align-items:center;gap:7px;margin:4px 0}
.lp-bar-label{font-size:9px;color:var(--t2);width:30px;text-align:right;flex-shrink:0;letter-spacing:.03em}
.lp-bar-track{flex:1;height:5px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.lp-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.lp-bar-count{font-size:9px;color:var(--t2);width:20px;text-align:right;flex-shrink:0}

/* Passage list */
.lp-search{
  width:100%;background:var(--srch-bg);border:1px solid var(--lp-bd);color:var(--t1);
  padding:6px 10px;font-size:11px;font-family:Georgia,serif;border-radius:3px;margin:8px 0 4px;
  transition:background .3s,border-color .3s
}
.lp-search:focus{outline:none;border-color:var(--t2)}
.lp-search::placeholder{color:var(--t2)}
.lp-passage-list{max-height:calc(100vh - 210px);overflow-y:auto}
.lp-passage-list::-webkit-scrollbar{width:3px}
.lp-passage-list::-webkit-scrollbar-track{background:var(--lp-bg-b)}
.lp-passage-list::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:2px}
.lp-passage-item{padding:6px 8px;cursor:pointer;border-radius:2px;margin:1px 0;transition:background .12s}
.lp-passage-item:hover{background:var(--item-hov)}
.lp-passage-item.lp-active{background:var(--item-act)}
.lp-pname{font-size:10px;color:var(--pname);margin-bottom:1px}
.lp-pmeta{font-size:9px;color:var(--pmeta)}

/* Passage detail */
.lp-back-link{font-size:10px;color:var(--back-link);cursor:pointer;margin-bottom:12px;display:inline-block;letter-spacing:.03em}
.lp-back-link:hover{color:var(--gold)}
.lp-snippet{
  font-size:10px;color:var(--snip);line-height:1.7;
  border-top:1px solid var(--divider);padding-top:10px;margin-top:8px;
  max-height:180px;overflow-y:auto
}
.lp-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.link-chip{
  background:var(--chip-bg);border:1px solid var(--chip-bd);color:var(--chip-col);
  font-size:9px;padding:3px 8px;border-radius:10px;cursor:pointer;
  transition:border-color .2s,background .3s;letter-spacing:.02em
}
.link-chip:hover{border-color:#2d5a88;color:#4a80b8}
.link-chip.disabled{opacity:0.35;cursor:default}

/* ---- Right panel (3D) ---- */
#rp{flex:1;position:relative;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}
#breadcrumb{
  position:absolute;top:12px;left:14px;color:#d4af37;font-size:11px;z-index:100;
  letter-spacing:.07em;text-shadow:0 0 10px rgba(212,175,55,.5);
  font-variant:small-caps;pointer-events:none
}
#back-btn{
  position:absolute;top:8px;right:14px;z-index:100;
  background:rgba(0,0,28,.88);border:1px solid #d4af37;
  color:#d4af37;padding:4px 14px;font-size:11px;
  cursor:pointer;font-family:Georgia,serif;display:none;letter-spacing:.04em;
  transition:background .2s
}
#back-btn:hover{background:rgba(212,175,55,.18)}
#hint{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.18);font-size:10px;z-index:100;
  pointer-events:none;letter-spacing:.04em;white-space:nowrap
}
#tooltip{
  position:absolute;display:none;
  background:rgba(0,4,20,.96);border:1px solid #151f30;
  color:#b8b0a0;font-size:11px;padding:8px 12px;
  max-width:220px;z-index:200;line-height:1.65;
  pointer-events:none;border-radius:3px
}
.node-label{
  position:absolute;transform:translate(-50%,-145%);
  pointer-events:none;font-size:9px;font-family:Georgia,serif;
  text-shadow:0 1px 4px #000,0 0 8px #000;
  white-space:nowrap;z-index:50;letter-spacing:.03em
}
#legend{
  position:absolute;bottom:14px;left:14px;z-index:100;
  font-size:9px;color:#2a3040;line-height:2.2
}
#legend span{
  display:inline-block;width:7px;height:7px;
  border-radius:50%;margin-right:5px;vertical-align:middle
}
#title-card{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:200;pointer-events:none;transition:opacity 1.5s
}
#title-card h1{
  color:#d4af37;font-size:22px;letter-spacing:.15em;
  font-variant:small-caps;text-shadow:0 0 28px rgba(212,175,55,.45)
}
#title-card p{color:rgba(255,255,255,.35);font-size:11px;margin-top:7px;letter-spacing:.07em}

</style>
</head>
<body>
<div id="lp">
  <div id="lp-toolbar">
    <button id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark">&#9728;</button>
  </div>
  <div id="lp-content"></div>
</div>
<div id="rp">
  <div id="breadcrumb">Stone Moons Universe</div>
  <button id="back-btn" onclick="goBack()">&#8592; Back</button>
  <div id="hint">Click sphere &nbsp;&#183;&nbsp; Drag to rotate &nbsp;&#183;&nbsp; Scroll to zoom &nbsp;&#183;&nbsp; Esc back</div>
  <div id="tooltip"></div>
  <div id="legend">
    <span style="background:#2d6fd4"></span>Sarah &nbsp;&nbsp;
    <span style="background:#bb1030"></span>The Moon &nbsp;&nbsp;
    <span style="background:#c8a000"></span>Laurel
  </div>
  <div id="title-card">
    <h1>Stone Moons</h1>
    <p>3D Passage Universe &nbsp;&#183;&nbsp; 533 passages</p>
  </div>
</div>

 universe unto itself. We have stood upon the moon, the dust gr"},{"pid":450,"name":"Dedication","tags":"Note","word_count":155,"link_goto":["And for those who know","the moon is more than","the sum of her stones.","Directions","back","back","back","back","back","back","Undercoverings","Selene's dreams","Cat's eyes","Sarah","Laurel's World"],"character":"moon","chapter_id":"T1","depth":2,"prefix":"T1A2","snippet":"Dedication This is for all those lost under the (link-repeat:\"moon\")[(display:\"Modal code\")(append:?modal)[ (link-goto: \"And for those who know\", \"DEATH WAITS FOR LIFE\") ("},{"pid":451,"name":"Egress","tags":"Title","word_count":1578,"link_goto":["No doubt by now","you've noticed that the","link names in this story","tell stories themselves.","Links are the true","creators of meaning","in this work.","The interstices are","where everything happens.","When you read, you must","read between the lines.","Determine what happens","between the spaces.","And then, and only then,","will you understand","your place","in our lives.","It is never the","destination that matters.","Only the nitty-gritty","of the journey counts.","The meaning of our lives","depends on how you go.","Are you systematic?","Or are you chaotic?","Do you take the time","to understand the way","the light enters?","Or do you revel in","the darkness--thinking","you understand it all","when you truly don't","Know everything.","Understand everything.","Find out everything","by taking the links.","Make the links a part","of yourself--","a journey into","your own soul.","Perhaps then you","will understand the","analepsis in","your own life.","Because the relationships","range from superficial","to surrealistic, you","don't know what to expect.","Relax. Trace your steps","a couple of times.","You can always revisit","to ensure you understand.","And whatever patterns","you haven't seen","will still be there,","waiting for your mind","to unravel them.","What we are trying to","do here, and what you","find out here, does","not matter in the end.","If it did, you would need","time to understand it all.","No one has time to","parse each atom,","each quark, each galaxy.","So why do we try?","Why can't we just sit","in the green grass","on a summer day,","watch the world go by,","glance into the lovers'","hands and smiles?","Why are you here","talking with us about","these arcane","incomprehensibilities?","Perhaps it is because","we, both author and","reader, have found in","hypertext","a way to become more","than mere author,","than passive reader,","a way to be text.","Hypermedia must","be classified in new","ways--but it differs","from old texts only in","links and structure.","Do the new possibilities","inherent in the links","modify the way our minds","process information?","Is hypertext one more","step on the evolutionary","road to a better form","of humanity?","Or is it merely","**DELETE**","a sideshow,","a freak accident of","computer and text?","Will hypertext structure","last a millenium?","Will anyone be able","to read these words","and care about what","happens to us?","The whole point of","creating this hypertext","is to explore the battle","Sarah fights with the","moon and society.","The links and structure","in hypertext are the only","way we can tell this","story and let you ask:","who was right?","Who was sane?","Who did win?","We have only questions","to offer.","Our stories contradict","each other.","Sarah lives.","Sarah dies.","Sarah does neither.","We ourselves are","sworn to secrecy.","We cannot tell you","who is sane","and who is not.","We argue amongst","ourselves about the","true meaning.","And we have poked around","more than anyone else.","What the truth is,","what these links are,","what your life is,","is not so important.","Just know that there is","truth, that links mean","something important,","that your life is real.","If you understand","one relationship,","If you see one facet","of your life here,","If you once feel that","zero at the bone that","the uncorrupted truth","carries in its wake,","we will know.","We have done what","we set out to do.","The fact alone makes","this journey worthwhile.","But there is always","more to explore.","The desire to understand","the far side of anything,","a dark moon,","a mist-shrouded shore,","a trouble psyche,","these are what wait.","Only be satisfying","the urge to understand","will you be free","to live your life.","An unexamined life, or","unfollowed link","is a broken bud.","For who will never","know what could have","happened next, or","who could have lived.","But as we crush an","infinity of possible","existences every moment,","abandoning more","possibilities is easy.","So explore for as","long as you like,","without feeling","that you need to see","or understand","absolutely everything.","Undercoverings","Selene's dreams","Cat's eyes"],"character":"util","chapter_id":"T1","depth":2,"prefix":"T1A3","snippet":"Egress (link-repeat:\"Note\")[(display:\"Modal code\")(append:?modal)[ (link-goto: \"No doubt by now\", \"Underlying truth\") (link-goto: \"you've noticed that the\", \"Desperate\") ("},{"pid":452,"name":"content","tags":"Note","word_count":70,"link_goto":["Directions"],"character":"moon","chapter_id":"T1","depth":3,"prefix":"T1A4B1","snippet":"content NOTE: As Arthur Conan Doyle says in his preface to Round the Fire Stories, \"If my stories have the good fortune to give pleasure to anyone, at anytime or place,"},{"pid":453,"name":"Undercoverings","tags":"Title","word_count":1002,"link_goto":["Selene's dreams","Cat's eyes","Sarah","Laurel's World"],"character":"util","chapter_id":"","depth":1,"prefix":"","snippet":"Undercoverings //2025 note: In the original Stone Moons, this page had been an introduction that encompassed all of the links for Sarah's nodes. This page had been corrup"},{"pid":454,"name":"Cat's eyes","tags":"Title","word_count":110,"link_goto":["Laurel's World","When mouths do not work","bridges to the mind,","we must fin // ---- Colored star field ----
(function() {
  const n = 3200;
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const palette = [[1,.92,.82],[.82,.9,1],[1,.86,.62],[.68,.8,1],[1,.62,.42],[.9,1,.9]];
  for (let i = 0; i < n; i++) {
    const r = 900 + Math.random() * 700;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const c = palette[Math.floor(Math.random() * palette.length)];
    col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo,
    new THREE.PointsMaterial({ vertexColors: true, size: 1.1, sizeAttenuation: true })
  ));
})();

// ---- Fibonacci sphere layout ----
function fibSphere(n, radius) {
  if (n === 0) return [];
  if (n === 1) return [new THREE.Vector3(0, 0, radius)];
  const ga = Math.PI * (3 - Math.sqrt(5));
  return Array.from({ length: n }, (_, i) => {
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = ga * i;
    return new THREE.Vector3(r * Math.cos(theta) * radius, y * radius, r * Math.sin(theta) * radius);
  });
}

// ---- Glow sprite (canvas radial gradient + AdditiveBlending) ----
function makeGlowSprite(pos, colorHex, scale) {
  const sz = 128, cv = document.createElement('canvas');
  cv.width = cv.height = sz;
  const ctx = cv.getContext('2d');
  const half = sz / 2;
  const R = (colorHex >> 16) & 255, G = (colorHex >> 8) & 255, B = colorHex & 255;
  const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
  grad.addColorStop(0,    `rgba(${R},${G},${B},0.85)`);
  grad.addColorStop(0.35, `rgba(${R},${G},${B},0.35)`);
  grad.addColorStop(1,    `rgba(${R},${G},${B},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, sz, sz);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({
    map: tex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(pos);
  sprite.scale.setScalar(scale);
  scene.add(sprite);
  activeObjs.push(sprite);
  return sprite;
}

// ---- Planetary ring ----
function addPlanetRing(pos, colorHex, innerR, outerR) {
  const geo = new THREE.RingGeometry(innerR, outerR, 32);
  const mat = new THREE.MeshBasicMaterial({
    color: colorHex, transparent: true, opacity: 0.22, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.position.copy(pos);
  ring.rotation.x = Math.PI / 3.2;
  scene.add(ring);
  activeObjs.push(ring);
  return ring;
}

function clearScene() {
  activeObjs.forEach(obj => {
    scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose());
    }
  });
  activeObjs = [];
  activeLabels.forEach(el => el.remove());
  activeLabels = [];
  CLICKABLES = [];
  hovered = null;
  hideTooltip();
}

// ---- Node / edge builders ----
function addNode(pos, radius, colorHex, userData, clickable = true) {
  const segs = radius > 16 ? [28, 18] : radius > 8 ? [18, 12] : [12, 8];
  const geo  = new THREE.SphereGeometry(radius, segs[0], segs[1]);
  const mat  = new THREE.MeshStandardMaterial({
    color:             colorHex,
    emissive:          colorHex,
    emissiveIntensity: 0.18,
    roughness:         0.32,
    metalness:         0.28,
    transparent:       true,
    opacity:           0.92,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.userData = userData;
  scene.add(mesh);
  activeObjs.push(mesh);
  if (clickable) CLICKABLES.push(mesh);
  return mesh;
}

function addEdge(a, b, colorHex = 0x2244aa, opacity = 0.18) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  activeObjs.push(line);
}

function addGlow(pos, colorHex, distance, intensity = 0.75) {
  const light = new THREE.PointLight(colorHex, intensity, distance);
  light.position.copy(pos);
  scene.add(light);
  activeObjs.push(light);
}

function addLabel(text, worldPos, colorStr) {
  const el = document.createElement('div');
  el.className = 'node-label';
  el.textContent = text;
  el.style.color = colorStr;
  el._wp = worldPos.clone();
  container.appendChild(el);
  activeLabels.push(el);
}

// ---- Label projection ----
function updateLabels() {
  const W = container.clientWidth, H = container.clientHeight;
  activeLabels.forEach(el => {
    const v = el._wp.clone().project(camera);
    if (v.z > 1) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.style.left = ((v.x * .5 + .5) * W).toFixed(0) + 'px';
    el.style.top  = ((-v.y * .5 + .5) * H).toFixed(0) + 'px';
  });
}

// ---- Tooltip ----
const _tip = document.getElementById('tooltip');
function showTooltip(data, clientX, clientY) {
  if (!data.label) return;
  const lines = [`<strong style="color:#d4af37">${data.label}</strong>`];
  if (data.passage_count != null) lines.push(`${data.passage_count} passages`);
  if (data.word_count)            lines.push(`${data.word_count.toLocaleString()} words`);
  if (data.tags)                  lines.push(`<span style="color:#444">Tags: ${data.tags}</span>`);
  if (data.depth > 1)             lines.push(`<span style="color:#444">Depth: ${data.depth}</span>`);
  _tip.innerHTML = lines.join('<br>');
  _tip.style.display = 'block';
  const rect = container.getBoundingClientRect();
  const lx = clientX - rect.left, ly = clientY - rect.top;
  _tip.style.left = Math.min(lx + 14, container.clientWidth  - 230) + 'px';
  _tip.style.top  = Math.min(ly - 10, container.clientHeight - 130) + 'px';
}
function hideTooltip() { _tip.style.display = 'none'; }

// ---- Raycasting (offset-corrected for split panel) ----
const rc = new THREE.Raycaster();
const m2 = new THREE.Vector2();

function updateMouse(e) {
  const rect = container.getBoundingClientRect();
  m2.x =  ((e.clientX - rect.left) / container.clientWidth)  * 2 - 1;
  m2.y = -((e.clientY - rect.top)  / container.clientHeight) * 2 + 1;
}

container.addEventListener('mousemove', e => {
  updateMouse(e);
  if (animating) return;
  rc.setFromCamera(m2, camera);
  const hits = rc.intersectObjects(CLICKABLES);
  if (hits.length) {
    const obj = hits[0].object;
    if (hovered !== obj) {
      if (hovered) hovered.material.emissiveIntensity = 0.18;
      hovered = obj;
      obj.material.emissiveIntensity = 0.65;
    }
    showTooltip(obj.userData, e.clientX, e.clientY);
    container.style.cursor = 'pointer';
  } else {
    if (hovered) { hovered.material.emissiveIntensity = 0.18; hovered = null; }
    hideTooltip();
    container.style.cursor = 'default';
  }
});

container.addEventListener('click', e => {
  if (animating) return;
  updateMouse(e);
  rc.setFromCamera(m2, camera);
  const hits = rc.intersectObjects(CLICKABLES);
  if (hits.length) handleClick(hits[0].object.userData);
});

// ---- Camera animation ----
function flyTo(targetPos, targetLookAt, ms, done) {
  animating = true;
  controls.enabled = false;
  const s0 = camera.position.clone(), t0 = controls.target.clone();
  const t1 = performance.now();
  const ease = t => t < .5 ? 2*t*t : -1 + (4-2*t)*t;
  (function tick() {
    const raw = Math.min((performance.now() - t1) / ms, 1);
    camera.position.lerpVectors(s0, targetPos, ease(raw));
    controls.target.lerpVectors(t0, targetLookAt, ease(raw));
    controls.update();
    if (raw < 1) { requestAnimationFrame(tick); return; }
    animating = false;
    controls.enabled = true;
    if (done) done();
  })();
}

    ['Stone Moons', ...levelStack.map(l => l.label)].join(' › ');
}

function pushLevel(label, rebuildFn, savedLP) {
  levelStack.push({
    label, rebuild: rebuildFn,
    camPos: camera.position.clone(), camTarget: controls.target.clone(),
    lpStateSaved: savedLP,
  });
  document.getElementById('back-btn').style.display = '';
  updateBreadcrumb();
}

function goBack() {
  if (!levelStack.length || animating) return;
  const prev = levelStack.pop();
  prev.rebuild();
  flyTo(prev.camPos, prev.camTarget, 650);
  if (prev.lpStateSaved) setLP(prev.lpStateSaved);
  document.getElementById('back-btn').style.display = levelStack.length ? '' : 'none';
  updateBreadcrumb();
}

function handleClick(data) {
  if      (data.type === 'character') enterCharacter(data.id);
  else if (data.type === 'chapter')   enterChapter(data.charId, data.id);
  else if (data.type === 'passage') {
    highlightPassageMesh(data.id);
    setLP({ type: 'passage', passage: data, charId: data.character, chapterId: data.chapter_id });
  }
}

// ---- LP interaction helpers ----
function highlightPassageMesh(pid) {
  CLICKABLES.forEach(obj => {
    if (obj.userData.type === 'passage') {
      obj.material.emissiveIntensity = obj.userData.id === pid ? 0.75 : 0.15;
    }
  });
}

function highlightPassage(pid) {
  highlightPassageMesh(pid);
  const item = document.querySelector(`.lp-passage-item[data-pid="${pid}"]`);
  if (item) {
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    item.classList.add('lp-active');
    setTimeout(() => item.classList.remove('lp-active'), 1600);
  }
  const p = PASSAGES.find(q => q.pid === pid);
  if (p) setLP({ type: 'passage', passage: p, charId: p.character, chapterId: p.chapter_id });
}

function clickPassageItem(pid) {
  highlightPassageMesh(pid);
  const p = PASSAGES.find(q => q.pid === pid);
  if (p) setLP({ type: 'passage', passage: p, charId: p.character, chapterId: p.chapter_id });
  const mesh = CLICKABLES.find(obj => obj.userData.type === 'passage' && obj.userData.id === pid);
  if (mesh) {
    const cp = mesh.position.clone();
    cp.z += 55;
    flyTo(cp, mesh.position.clone(), 520);
  }
}

function filterPassageList(query) {
  const q = (query || '').toLowerCase().trim();
  document.querySelectorAll('#passage-list .lp-passage-item').forEach(el => {
    const name = (el.querySelector('.lp-pname')?.textContent || '').toLowerCase();
    el.style.display = (!q || name.includes(q)) ? '' : 'none';
  });
}

// ============================================================
// LP state machine
// ============================================================

function setLP(state) {
  currentLPState = state;
  const el = document.getElementById('lp-content');
  if (!el) return;
  if      (state.type === 'universe')  el.innerHTML = lpUniverse();
  else if (state.type === 'character') el.innerHTML = lpCharacter(state.charId);
  else if (state.type === 'chapter')   el.innerHTML = lpChapter(state.charId, state.chapterId);
  else if (state.type === 'passage')   el.innerHTML = lpPassage(state);
}

// ---- LP: Universe ----
function lpUniverse() {
  const sarah  = charPassages.sarah.length;
  const moon   = charPassages.moon.length;
  const laurel = charPassages.laurel.length;
  const n      = sarah + moon + laurel;  // named 'n' to avoid Python 533 placeholder collision
  const totalWords = (ov.word_count || ov.total_word_count || 192382).toLocaleString();
  const maxDepth   = ov.max_depth || ov.deepest_chain || 13;
  const navEdges   = (ov.nav_edges || ov.navigation_edges || ov.nav_edge_count || 3268).toLocaleString();

  // Donut arcs
  const cx = 75, cy = 75, R = 55, ir = 26;
  function arc(startA, sweep, fill) {
    if (sweep >= Math.PI * 2) sweep = Math.PI * 2 - 0.001;
    const endA = startA + sweep;
    const x1s = cx + R*Math.cos(startA), y1s = cy + R*Math.sin(startA);
    const x1e = cx + R*Math.cos(endA),   y1e = cy + R*Math.sin(endA);
    const x2e = cx + ir*Math.cos(endA),  y2e = cy + ir*Math.sin(endA);
    const x2s = cx + ir*Math.cos(startA),y2s = cy + ir*Math.sin(startA);
    const lg = sweep > Math.PI ? 1 : 0;
    return `<path d="M${x1s.toFixed(1)},${y1s.toFixed(1)} A${R},${R} 0 ${lg},1 ${x1e.toFixed(1)},${y1e.toFixed(1)} L${x2e.toFixed(1)},${y2e.toFixed(1)} A${ir},${ir} 0 ${lg},0 ${x2s.toFixed(1)},${y2s.toFixed(1)} Z" fill="${fill}" opacity="0.88"/>`;
  }
  const tau = Math.PI * 2;
  let a = -Math.PI / 2;
  const sA = (sarah / n) * tau, mA = (moon / n) * tau, lA = (laurel / n) * tau;
  const donut = arc(a, sA, '#2d6fd4') + arc(a + sA, mA, '#bb1030') + arc(a + sA + mA, lA, '#c8a000');

  return `
<div class="lp-title">Stone Moons</div>
<div class="lp-subtitle">Hypertext Novel &nbsp;·&nbsp; Three Voices</div>
<div style="display:flex;align-items:center;gap:14px;margin:10px 0 14px">
  <svg width="150" height="150" viewBox="0 0 150 150" style="flex-shrink:0">
    ${donut}
    <circle cx="${cx}" cy="${cy}" r="${ir}" fill="var(--lp-bg-b,#020612)"/>
    <text x="${cx}" y="${cy-5}" text-anchor="middle" fill="var(--gold,#d4af37)" font-size="14" font-family="Georgia,serif">${n}</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" fill="var(--t2,#888070)" font-size="8" font-family="Georgia,serif">passages</text>
  </svg>
  <div style="min-width:0">
    <div class="lp-stat-row"><span style="color:#2d6fd4">■</span><span class="lp-sr-lbl">Sarah</span><span class="lp-stat-val">${sarah}</span></div>
    <div class="lp-stat-row"><span style="color:#bb1030">■</span><span class="lp-sr-lbl">The Moon</span><span class="lp-stat-val">${moon}</span></div>
    <div class="lp-stat-row"><span style="color:#c8a000">■</span><span class="lp-sr-lbl">Laurel</span><span class="lp-stat-val">${laurel}</span></div>
  </div>
</div>
<div class="lp-stats-grid">
  <div class="lp-stat-card"><div class="lp-stat-num">${totalWords}</div><div class="lp-stat-lbl">words</div></div>
  <div class="lp-stat-card"><div class="lp-stat-num">16</div><div class="lp-stat-lbl">Sarah chapters</div></div>
  <div class="lp-stat-card"><div class="lp-stat-num">${maxDepth}</div><div class="lp-stat-lbl">max depth</div></div>
  <div class="lp-stat-card"><div class="lp-stat-num">${navEdges}</div><div class="lp-stat-lbl">nav edges</div></div>
</div>
<div class="lp-divider"></div>
<div class="lp-char-card" style="border-color:#2d6fd4">
  <div class="lp-char-name" style="color:#2d6fd4">Sarah</div>
  <div class="lp-char-desc">The mother's voice. 16 chapters (A1–A16) of emails, court battles, and desperate attempts to protect her daughter Laurel from Social Services and the Moon.</div>
</div>
<div class="lp-char-card" style="border-color:#bb1030">
  <div class="lp-char-name" style="color:#bb1030">The Moon</div>
  <div class="lp-char-desc">A mythic deity hunting Laurel's soul. Two clusters: Moon passages (direct narrative) and Red Notes — blood portents and omens foreshadowing Laurel's fate.</div>
</div>
<div class="lp-char-card" style="border-color:#c8a000">
  <div class="lp-char-name" style="color:#c8a000">Laurel</div>
  <div class="lp-char-desc">An autistic pre-verbal child. Her voice emerges through facilitated typing. Four sections with no outgoing links — she is reached, never seeking.</div>
</div>
<div class="lp-hint">Click a sphere to explore a character</div>
  `;
}

// ---- LP: Character ----
function lpCharacter(charId) {
  const cc = { sarah: '#2d6fd4', moon: '#bb1030', laurel: '#c8a000' };
  const color = cc[charId] || '#888';
  const label = { sarah: 'Sarah', moon: 'The Moon', laurel: 'Laurel' }[charId] || charId;
  const descs = {
    sarah:  'Sixteen chapters spanning Laurel\'s childhood. Sarah\'s emails shift from hope to exhaustion as Social Services and the Moon press closer. The rim and outside of the wine glass.',
    moon:   'The antagonist-deity, old as stars. Moon passages carry her direct voice; Red Notes are her blood-portents seeping into the world — omens visible only to those who know to look.',
    laurel: 'Pre-verbal, autistic, and beloved. Her chapters emerge through facilitated typing sessions. Four sections with no outgoing links — the cup\'s stem and base.',
  };

  let barsHtml = '';
  if (charId === 'sarah') {
    const chs = STATS.chapters_sarah || [];
    const mx = Math.max(...chs.map(c => c.passage_count), 1);
    barsHtml = chs.map(ch => {
      const pct = (ch.passage_count / mx * 100).toFixed(0);
      return `<div class="lp-bar-row">
        <div class="lp-bar-label">${ch.chapter_id}</div>
        <div class="lp-bar-track"><div class="lp-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="lp-bar-count">${ch.passage_count}</div>
      </div>`;
    }).join('');
  } else if (charId === 'moon') {
    const tot = moonPassages.length + notePassages.length || 1;
    barsHtml = `
      <div class="lp-bar-row">
        <div class="lp-bar-label">Moon</div>
        <div class="lp-bar-track"><div class="lp-bar-fill" style="width:${(moonPassages.length/tot*100).toFixed(0)}%;background:#bb1030"></div></div>
        <div class="lp-bar-count">${moonPassages.length}</div>
      </div>
      <div class="lp-bar-row">
        <div class="lp-bar-label">Notes</div>
        <div class="lp-bar-track"><div class="lp-bar-fill" style="width:${(notePassages.length/tot*100).toFixed(0)}%;background:#880020"></div></div>
        <div class="lp-bar-count">${notePassages.length}</div>
      </div>`;
  } else {
    const secs = STATS.chapters_laurel || [];
    const mx = Math.max(...secs.map(c => c.passage_count), 1);
    barsHtml = secs.map(sec => {
      const pct = (sec.passage_count / mx * 100).toFixed(0);
      return `<div class="lp-bar-row">
        <div class="lp-bar-label">${sec.chapter_id}</div>
        <div class="lp-bar-track"><div class="lp-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="lp-bar-count">${sec.passage_count}</div>
      </div>`;
    }).join('');
  }

  return `
<div class="lp-title" style="color:${color}">${label}</div>
<div class="lp-char-desc" style="margin:10px 0 16px;color:#4a4030">${descs[charId] || ''}</div>
<div class="lp-section-hdr">Chapters / Sections</div>
<div class="lp-bars">${barsHtml}</div>
<div class="lp-hint">Click a chapter sphere to explore its passages</div>
  `;
}

// ---- LP: Chapter (passage list) ----
function lpChapter(charId, chapterId) {
  const cc = { sarah: '#2d6fd4', moon: '#bb1030', laurel: '#c8a000' };
  const color = cc[charId] || '#888';
  const moonColor = chapterId === 'Note' ? '#880020' : '#bb1030';
  const listColor = charId === 'moon' ? moonColor : color;

  let passages;
  if (charId === 'sarah')       passages = charPassages.sarah.filter(p => p.chapter_id === chapterId);
  else if (charId === 'moon')   passages = charPassages.moon.filter(p => p.tags.includes(chapterId));
  else                          passages = charPassages.laurel.filter(p => p.chapter_id === chapterId);

  const items = passages.map(p => {
    const wc  = p.word_count ? `${p.word_count.toLocaleString()} w` : '';
    const dep = p.depth > 1 ? `D${p.depth}` : '';
    const meta = [wc, dep].filter(Boolean).join(' · ');
    return `<div class="lp-passage-item" data-pid="${p.pid}" onclick="clickPassageItem(${p.pid})">
      <div class="lp-pname" style="color:${listColor}">${p.name}</div>
      ${meta ? `<div class="lp-pmeta">${meta}</div>` : ''}
    </div>`;
  }).join('');

  return `
<div class="lp-title" style="color:${listColor}">${chapterId}</div>
<div class="lp-subtitle">${passages.length} passages</div>
<input id="passage-search" class="lp-search" placeholder="Filter passages…" oninput="filterPassageList(this.value)">
<div id="passage-list" class="lp-passage-list">${items}</div>
<div class="lp-hint">Click a passage to see detail · click sphere in 3D to highlight</div>
  `;
}

// ---- LP: Passage detail ----
function lpPassage(state) {
  const p = state.passage;
  const charId    = state.charId    || p.character   || 'util';
  const chapterId = state.chapterId || p.chapter_id  || '';
  const cc = { sarah: '#2d6fd4', moon: '#bb1030', laurel: '#c8a000' };
  const color = (charId === 'moon' && p.tags && p.tags.includes('Note')) ? '#880020' : (cc[charId] || '#888');

  const links = (p.link_goto || []).map(name => {
    const tgt = byName[name];
    const cls = tgt ? 'link-chip' : 'link-chip disabled';
    const pid = tgt ? tgt.pid : '';
    const onclick = tgt ? `onclick="highlightPassage(${pid})"` : '';
    return `<span class="${cls}" data-pid="${pid}" ${onclick}>${name}</span>`;
  }).join('');

  const meta = [
    p.tags ? `Tags: ${p.tags}` : '',
    p.word_count ? `${p.word_count.toLocaleString()} words` : '',
    p.depth > 1  ? `Depth ${p.depth}` : '',
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  return `
<span class="lp-back-link" onclick="setLP({type:'chapter',charId:'${charId}',chapterId:'${chapterId}'})">&#8592; All passages</span>
<div class="lp-title" style="color:${color}">${p.name || p.label || ''}</div>
${meta ? `<div style="color:#2a3040;font-size:9px;margin:5px 0 12px">${meta}</div>` : ''}
${p.snippet ? `<div class="lp-snippet">${p.snippet.replace(/</g, '&lt;')}</div>` : ''}
${links ? `<div class="lp-section-hdr" style="margin-top:14px">Outgoing links</div><div class="lp-links">${links}</div>` : ''}
  `;
}

// ============================================================
// Scene builders (pure — no nav side-effects)
// ============================================================

function _buildUniverse() {
  const chars = [
    { id:'laurel', label:'Laurel',   color:0xc8a000, cs:'#c8a000', y:-85, size:22, n:charPassages.laurel.length },
    { id:'moon',   label:'The Moon', color:0xbb1030, cs:'#bb1030', y:  0, size:36, n:charPassages.moon.length   },
    { id:'sarah',  label:'Sarah',    color:0x2d6fd4, cs:'#2d6fd4', y: 95, size:46, n:charPassages.sarah.length  },
  ];
  chars.forEach(ch => {
    const pos = new THREE.Vector3(0, ch.y, 0);
    addNode(pos, ch.size, ch.color, { type:'character', id:ch.id, label:ch.label, passage_count:ch.n });
    addGlow(pos, ch.color, ch.size * 7, 0.7);
    makeGlowSprite(pos, ch.color, ch.size * 5.5);
    addPlanetRing(pos, ch.color, ch.size + 9, ch.size + 19);
    addLabel(ch.label + ' · ' + ch.n,
             pos.clone().add(new THREE.Vector3(ch.size + 10, 0, 0)), ch.cs);
  });
  const stemPts = [new THREE.Vector3(0, -85, 0), new THREE.Vector3(0, 95, 0)];
  const stem = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(stemPts),
    new THREE.LineBasicMaterial({ color: 0x1a2a3a, transparent: true, opacity: 0.28 })
  );
  scene.add(stem);
  activeObjs.push(stem);
}

function _buildSarahChapters() {
  const chs = STATS.chapters_sarah || [];
  const pts = fibSphere(chs.length, 155);
  chs.forEach((ch, i) => {
    const pos  = pts[i];
    const name = ch.folder ? ch.folder.replace(/^A\d+_?/, '').replace(/_/g, ' ') : ch.chapter_id;
    const size = Math.sqrt(ch.passage_count) * 2.7 + 5;
    addNode(pos, size, 0x2d6fd4, { type:'chapter', charId:'sarah', id:ch.chapter_id,
      label:ch.chapter_id + ': ' + name, passage_count:ch.passage_count, word_count:ch.word_count });
    addLabel(ch.chapter_id, pos.clone().add(new THREE.Vector3(size + 4, 0, 0)), '#2d6fd4');
  });
}

function _buildMoonClusters() {
  const left  = new THREE.Vector3(-80, 0, 0);
  const right = new THREE.Vector3( 80, 0, 0);
  addNode(left,  30, 0xbb1030, { type:'chapter', charId:'moon', id:'Moon',
    label:'Moon', passage_count:moonPassages.length });
  addGlow(left,  0xbb1030, 145, 0.85);
  makeGlowSprite(left, 0xbb1030, 110);
  addNode(right, 24, 0x880020, { type:'chapter', charId:'moon', id:'Note',
    label:"Moon's Red Notes", passage_count:notePassages.length });
  addGlow(right, 0x880020, 115, 0.65);
  makeGlowSprite(right, 0x880020, 85);
  addEdge(left, right, 0xbb1030, 0.3);
  addLabel('Moon · ' + moonPassages.length,      left.clone().add(new THREE.Vector3(36, 0, 0)), '#bb1030');
  addLabel('Red Notes · ' + notePassages.length, right.clone().add(new THREE.Vector3(30, 0, 0)), '#880020');
}

function _buildLaurelSections() {
  const secs = STATS.chapters_laurel || [];
  const pts  = fibSphere(secs.length, 85);
  secs.forEach((sec, i) => {
    const pos  = pts[i];
    const size = Math.sqrt(sec.passage_count) * 3.5 + 6;
    addNode(pos, size, 0xc8a000, { type:'chapter', charId:'laurel', id:sec.chapter_id,
      label:'Section ' + sec.chapter_id, passage_count:sec.passage_count, word_count:sec.word_count });
    addLabel(sec.chapter_id, pos.clone().add(new THREE.Vector3(size + 4, 0, 0)), '#c8a000');
  });
}

function _buildPassages(charId, chapterId) {
  let passages, colorHex, radius;
  if (charId === 'sarah') {
    passages = charPassages.sarah.filter(p => p.chapter_id === chapterId);
    colorHex = 0x2d6fd4;
    radius   = Math.max(80, Math.sqrt(passages.length) * 13);
  } else if (charId === 'moon') {
    passages = charPassages.moon.filter(p => p.tags.includes(chapterId));
    colorHex = chapterId === 'Note' ? 0x880020 : 0xbb1030;
    radius   = Math.max(110, Math.sqrt(passages.length) * 13);
  } else {
    passages = charPassages.laurel.filter(p => p.chapter_id === chapterId);
    colorHex = 0xc8a000;
    radius   = Math.max(60, Math.sqrt(passages.length) * 13);
  }
  if (!passages.length) return false;

  const pts    = fibSphere(passages.length, radius);
  const pidPos = {};
  passages.forEach((p, i) => {
    pidPos[p.pid] = pts[i];
    let pColor = colorHex;
    if (p.character === 'laurel' && p.tags.includes('Laurel-G')) pColor = 0x2e6a20;
    const size = Math.max(2.5, Math.log10(Math.max(1, p.word_count)) * 3.0);
    addNode(pts[i], size, pColor, {
      type: 'passage', id: p.pid, label: p.name,
      word_count: p.word_count, tags: p.tags,
      depth: p.depth, snippet: p.snippet, character: p.character, chapter_id: p.chapter_id,
    });
  });

  passages.forEach(p => {
    if (!pidPos[p.pid]) return;
    (p.link_goto || []).forEach(targetName => {
      const tgt = passages.find(q => q.name === targetName);
      if (tgt && pidPos[tgt.pid]) {
        addEdge(pidPos[p.pid], pidPos[tgt.pid], colorHex, 0.12);
      }
    });
  });

  return radius;
}

// ============================================================
// Navigation entry points
// ============================================================

function showUniverse() {
  levelStack = [];
  clearScene();
  _buildUniverse();
  document.getElementById('back-btn').style.display = 'none';
  updateBreadcrumb();
  setLP({ type: 'universe' });
}

function enterCharacter(charId) {
  const label = { sarah: 'Sarah', moon: 'The Moon', laurel: 'Laurel' }[charId] || charId;
  pushLevel(label, () => { clearScene(); _buildUniverse(); }, { type: 'universe' });
  clearScene();
  if (charId === 'sarah') {
    _buildSarahChapters();
    flyTo(new THREE.Vector3(0, 0, 370), new THREE.Vector3(0, 0, 0), 780);
  } else if (charId === 'moon') {
    _buildMoonClusters();
    flyTo(new THREE.Vector3(0, 0, 280), new THREE.Vector3(0, 0, 0), 720);
  } else {
    _buildLaurelSections();
    flyTo(new THREE.Vector3(0, 0, 230), new THREE.Vector3(0, 0, 0), 720);
  }
  setLP({ type: 'character', charId });
}

function enterChapter(charId, chapterId) {
  const parentBuilder = () => {
    clearScene();
    if      (charId === 'sarah') _buildSarahChapters();
    else if (charId === 'moon')  _buildMoonClusters();
    else                         _buildLaurelSections();
  };
  pushLevel(chapterId, parentBuilder, { type: 'character', charId });
  clearScene();
  const radius = _buildPassages(charId, chapterId);
  if (radius === false) { goBack(); return; }
  flyTo(new THREE.Vector3(0, 0, radius * 2.2 + 55), new THREE.Vector3(0, 0, 0), 760);
  setLP({ type: 'chapter', charId, chapterId });
}

// ---- Render loop ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  CLICKABLES.forEach(obj => {
    if (obj.userData.type === 'character') obj.rotation.y = t * 0.14;
  });
  if (!animating) controls.update();
  renderer.render(scene, camera);
  updateLabels();
}

// ---- Theme toggle ----
function toggleTheme() {
  const light = document.body.classList.toggle('lm');
  document.getElementById('theme-btn').textContent = light ? '☽' : '☀';
  // Refresh LP so SVG text colors update
  if (currentLPState) setLP(currentLPState);
}

// ---- Title card fade ----
const titleCard = document.getElementById('title-card');
setTimeout(() => { titleCard.style.opacity = '0'; }, 2500);
setTimeout(() => { titleCard.remove(); }, 4100);

// ---- Init ----
showUniverse();
animate();

</script>
